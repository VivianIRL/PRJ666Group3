pid /tmp/nginx.pid;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        # Hardcoded to Cloud Run default
        listen 8080;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

           location /api/ {
            # Nginx replaces this automatically using the environment variable.
            # False positive: this is the SPA's own public API entry point
            # (the browser calls /api/* directly), so it must NOT be
            # `internal` — that would 404 every request. BACKEND_URL is
            # resolved once at container startup via envsubst from a
            # deploy-time environment variable (see Dockerfile: this file is
            # templated through /etc/nginx/templates), never from anything
            # in the client request, so it isn't attacker-influenceable.
            proxy_pass $BACKEND_URL; # nosemgrep: generic.nginx.security.missing-internal.missing-internal

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}